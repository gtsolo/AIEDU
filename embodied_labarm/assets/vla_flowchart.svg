<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="nodeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1300" height="760" rx="20" fill="url(#bg)"/>
  <text x="46" y="52" font-size="26" font-weight="700" fill="#0f172a">VLA 大模型决策流程图 · 三处显式介入节点</text>
  <text x="46" y="80" font-size="15" fill="#475569">LabArm-Embodied 指令流 × 感知流 × 接触反馈流三通道闭环</text>

  <!-- 顶部标签：3 大节点（评分维度 4 对应） -->
  <g transform="translate(920,28)">
    <rect width="336" height="40" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="168" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">🧠 AI 大模型介入节点 3/3 全流程覆盖</text>
  </g>

  <!-- 起始：用户指令 -->
  <g filter="url(#softShadow)">
    <rect x="46" y="118" width="280" height="66" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="186" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">👩‍🏫 用户自然语言指令</text>
    <text x="186" y="168" text-anchor="middle" font-size="12" fill="#1e40af">"打开 3 号实验柜，拉出中间抽屉…"</text>
  </g>

  <!-- 节点 ①：指令解析 -->
  <g filter="url(#softShadow)">
    <rect x="386" y="108" width="340" height="88" rx="16" fill="url(#nodeG)" stroke="#d97706" stroke-width="3"/>
    <rect x="386" y="108" width="100" height="24" rx="10" fill="#b91c1c"/>
    <text x="436" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">介入节点 ①</text>
    <text x="556" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">指令解析 · NL→结构化子任务</text>
    <text x="556" y="174" text-anchor="middle" font-size="13" fill="#451a03">InternVL2-VL-2B · Few-Shot Prompt + JSON Schema</text>
    <text x="556" y="192" text-anchor="middle" font-size="12" fill="#451a03">输出：{ high_level_goal, sub_tasks: [O1,O2,O3,O4], safety_policy }</text>
  </g>
  <path d="M 326 151 L 386 151" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 多模态感知数据（左侧汇入融合层） -->
  <g>
    <rect x="46" y="242" width="280" height="36" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="186" y="266" text-anchor="middle" font-size="13" fill="#075985">📷 RGB-D 腕部图像（224×224×4）</text>
    <rect x="46" y="288" width="280" height="36" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="186" y="312" text-anchor="middle" font-size="13" fill="#075985">💪 F/T 六维力/力矩序列（T=10, 50ms/步）</text>
    <rect x="46" y="334" width="280" height="36" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="186" y="358" text-anchor="middle" font-size="13" fill="#075985">⚙ 关节编码器 (7DoF 位置+速度)</text>
  </g>

  <!-- 融合层 -->
  <g filter="url(#softShadow)">
    <rect x="386" y="272" width="340" height="74" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="556" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">🔀 多模态融合 Perceiver IO</text>
    <text x="556" y="326" text-anchor="middle" font-size="13" fill="#3730a3">视觉(256d) ⊕ F/T(64d) ⊕ 关节(64d) → 512d Token</text>
    <text x="556" y="344" text-anchor="middle" font-size="12" fill="#3730a3">时间滑窗 T=10，接触事件检测延迟 ≤20ms</text>
  </g>
  <path d="M 326 260 L 386 300" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 326 306 L 386 309" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 326 352 L 386 322" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- 节点 ②：操作规划 -->
  <g filter="url(#softShadow)">
    <rect x="786" y="262" width="430" height="94" rx="16" fill="url(#nodeG)" stroke="#d97706" stroke-width="3"/>
    <rect x="786" y="262" width="100" height="24" rx="10" fill="#b91c1c"/>
    <text x="836" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">介入节点 ②</text>
    <text x="1001" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">操作规划 · 子任务 → Action Token 序列</text>
    <g font-size="12" fill="#451a03" font-family="'Consolas', monospace">
      <text x="806" y="324">TOKEN_01: MoveL     [dx=22.4, dy=-3.1, fz=0]</text>
      <text x="806" y="342">TOKEN_02: ContactFz [fz=10N, 5mm/s 逼近]</text>
      <text x="806" y="360">TOKEN_03: Rotate    [Z +90°, τ≤1.2N·m]</text>
    </g>
  </g>
  <path d="M 726 309 L 786 309" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <!-- 指令解析 → 操作规划 的虚线箭头（传递子任务） -->
  <path d="M 556 196 C 556 224, 900 224, 900 256" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="640" y="228" font-size="11" fill="#6d28d9">子任务 JSON（高层语义）</text>

  <!-- 世界模型（在操作规划下方，闭环反馈） -->
  <g filter="url(#softShadow)">
    <rect x="386" y="410" width="340" height="102" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
    <rect x="386" y="410" width="154" height="22" rx="9" fill="#be123c"/>
    <text x="463" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">★ 创新点 · 世界模型</text>
    <text x="556" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#9f1239">Contact-State Diffusion VAE</text>
    <text x="556" y="476" text-anchor="middle" font-size="13" fill="#881337">输入：F/T + 关节时序（最近 10 步）+ VLA Action 条件</text>
    <text x="556" y="496" text-anchor="middle" font-size="13" fill="#881337">推断：抽屉行程 / 旋钮角度 / 插拔深度（不可见状态）</text>
    <text x="556" y="512" text-anchor="middle" font-size="12" fill="#9d174d" font-style="italic">强遮挡下 RMSE 1.8mm / 2.3° / 0.9mm</text>
  </g>

  <!-- 世界模型双向反馈 -->
  <path d="M 556 382 L 556 410" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
  <path d="M 726 440 L 786 309" stroke="#be185d" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
  <text x="718" y="360" font-size="11" fill="#9d174d" transform="rotate(-56 760 380)">World State → 操作规划条件</text>
  <text x="456" y="400" font-size="11" fill="#be123c">Action token 作为 Diffusion 条件 c</text>

  <!-- 执行阶段：控制 + 运动 -->
  <g filter="url(#softShadow)">
    <rect x="786" y="442" width="430" height="74" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1001" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">🦾 执行：运动规划 + 力位混合阻抗控制</text>
    <text x="1001" y="496" text-anchor="middle" font-size="13" fill="#166534">MoveIt2/RRT-Connect → CHOMP 优化 → 法向力闭环 |Fz| ≤ 15N · 急停阈值 50N</text>
    <text x="1001" y="514" text-anchor="middle" font-size="12" fill="#166534">4 类操作：O1 门锁 / O2 抽屉 / O3 旋钮 / O4 试管插拔</text>
  </g>
  <path d="M 1001 356 L 1001 442" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 接触状态判断分支 -->
  <g filter="url(#softShadow)">
    <rect x="786" y="570" width="430" height="66" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="1001" y="598" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">📡 接触状态判断（含世界模型推断）</text>
    <text x="1001" y="624" text-anchor="middle" font-size="13" fill="#334155">成功？→ 下一个子任务（Back to 节点 ②） / 失败或卡滞？→ 进入 节点 ③</text>
  </g>
  <path d="M 1001 516 L 1001 570" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 节点 ③：异常恢复（在判断分支左侧） -->
  <g filter="url(#softShadow)">
    <rect x="46" y="558" width="700" height="92" rx="16" fill="url(#nodeG)" stroke="#d97706" stroke-width="3"/>
    <rect x="46" y="558" width="100" height="24" rx="10" fill="#b91c1c"/>
    <text x="96" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">介入节点 ③</text>
    <text x="396" y="598" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">接触异常恢复 · VLA 条件采样 5 类策略</text>
    <g font-size="12" fill="#451a03">
      <rect x="66" y="608" width="124" height="34" rx="6" fill="#fff7ed" stroke="#c2410c"/>
      <text x="128" y="622" text-anchor="middle" font-weight="700">RETRY_BACKOFF</text>
      <text x="128" y="636" text-anchor="middle">后退重试 O1/O4</text>
      <rect x="200" y="608" width="124" height="34" rx="6" fill="#fff7ed" stroke="#c2410c"/>
      <text x="262" y="622" text-anchor="middle" font-weight="700">SPIRAL_ALIGN</text>
      <text x="262" y="636" text-anchor="middle">螺旋搜索对中 O4</text>
      <rect x="334" y="608" width="124" height="34" rx="6" fill="#fff7ed" stroke="#c2410c"/>
      <text x="396" y="622" text-anchor="middle" font-weight="700">DITHER_RELEASE</text>
      <text x="396" y="636" text-anchor="middle">40Hz 微抖解锁 O2/O3</text>
      <rect x="468" y="608" width="124" height="34" rx="6" fill="#fff7ed" stroke="#c2410c"/>
      <text x="530" y="622" text-anchor="middle" font-weight="700">REGRASP</text>
      <text x="530" y="636" text-anchor="middle">重新抓取姿态</text>
      <rect x="602" y="608" width="124" height="34" rx="6" fill="#fff7ed" stroke="#c2410c"/>
      <text x="664" y="622" text-anchor="middle" font-weight="700">HUMAN_HELP</text>
      <text x="664" y="636" text-anchor="middle">3 次失败求人工</text>
    </g>
  </g>
  <!-- 失败分支箭头：判断 → 节点 ③ -->
  <path d="M 786 603 L 746 603" stroke="#b91c1c" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="752" y="590" font-size="12" fill="#b91c1c" font-weight="700">失败 / F/T 超限</text>

  <!-- 成功分支循环回到 节点 ② -->
  <path d="M 1216 603 C 1260 603, 1260 200, 1216 309" stroke="#15803d" stroke-width="2.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
  <text x="1218" y="454" font-size="12" fill="#15803d" font-weight="700" transform="rotate(90 1232 458)">成功 → 下一个子任务</text>

  <!-- 节点 ③ → 节点 ② 恢复重试 循环箭头 -->
  <path d="M 396 558 C 396 520, 900 520, 900 356" stroke="#b45309" stroke-width="2.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
  <text x="340" y="546" font-size="12" fill="#92400e" font-weight="700">恢复策略执行 → 重试原操作</text>

  <!-- 结束点 -->
  <g filter="url(#softShadow)">
    <rect x="516" y="684" width="280" height="56" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="656" y="712" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">✅ 全子任务完成 · 结束</text>
    <text x="656" y="732" text-anchor="middle" font-size="12" fill="#166534">操作日志 + 视频 + 成功率曲线归档</text>
  </g>
  <path d="M 656 636 L 656 684" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- 图例：评分维度映射 -->
  <g transform="translate(46,456)">
    <rect width="310" height="42" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="155" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">评分维度映射（5×20 分）</text>
    <g font-size="10.5">
      <circle cx="26" cy="34" r="5" fill="#0ea5e9"/><text x="36" y="37" fill="#334155">技术可行性：控制+规划链路完整</text>
      <circle cx="178" cy="34" r="5" fill="#ef4444"/><text x="188" y="37" fill="#334155">AI 模型：3 红色节点全流程 ✓</text>
    </g>
  </g>
</svg>
